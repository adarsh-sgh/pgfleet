name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: generated code is current
        run: make generate && git diff --exit-code
      - run: go vet ./...
      - name: envtest e2e
        run: make test
