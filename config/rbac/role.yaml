---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgfleet
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
  - get
- apiGroups:
  - ""
  resources:
  - pods/resize
  verbs:
  - patch
- apiGroups:
  - pgfleet.dev
  resources:
  - postgresinstances
  - warmpools
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pgfleet.dev
  resources:
  - postgresinstances/finalizers
  verbs:
  - update
- apiGroups:
  - pgfleet.dev
  resources:
  - postgresinstances/status
  - warmpools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
